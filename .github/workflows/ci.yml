name: CI/CD

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: cd SHEMALEWIKI.ONLINE/frontend && npm install
      - name: ESLint (non-blocking baseline)
        run: cd SHEMALEWIKI.ONLINE/frontend && npx eslint src/ --max-warnings=50 || true
        continue-on-error: true

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: cd SHEMALEWIKI.ONLINE/frontend && npm install
      - run: cd SHEMALEWIKI.ONLINE/frontend && npx vitest run

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: cd SHEMALEWIKI.ONLINE/frontend && npm install
      - run: cd SHEMALEWIKI.ONLINE/frontend && npx vite build

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: [build]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: cd SHEMALEWIKI.ONLINE/frontend && npm install
      - run: cd SHEMALEWIKI.ONLINE/frontend && npx vite build
      - name: Deploy to Vercel
        run: |
          cd SHEMALEWIKI.ONLINE/frontend
          npm install -g vercel@latest
          vercel deploy --prod --token=${{ secrets.VERCEL_TOKEN }} --yes --scope=${{ secrets.VERCEL_ORG_ID }} --project=${{ secrets.VERCEL_PROJECT_ID }}
